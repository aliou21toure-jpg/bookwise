name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit

  integration:
    name: Integration tests (PostgreSQL 17, Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_URL: http://localhost:3000
      DATABASE_URL: postgres://bookwise_app:app_ci_pw@localhost:5432/bookwise_test
      DATABASE_MIGRATION_URL: postgres://bookwise_owner:owner_ci_pw@localhost:5432/bookwise_test
      REDIS_URL: redis://localhost:6379/1
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      REQUIRE_EMAIL_VERIFICATION: "true"
      MAIL_TRANSPORT: memory
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - name: Create roles and an empty database
        env: { PGPASSWORD: postgres }
        run: |
          psql -h localhost -U postgres -v owner_password=owner_ci_pw -v app_password=app_ci_pw -f scripts/db/create-roles.sql
          psql -h localhost -U postgres -v dbname=bookwise_test -f scripts/db/create-database.sql
      - name: Migrate a clean database (twice, to prove it is idempotent)
        run: npm run db:migrate && npm run db:migrate
      - run: npm run test:integration

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run build:worker

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - name: npm audit (fail on high or critical)
        run: npm audit --audit-level=high
      - name: gitleaks (secret scan of the full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: bookwise:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    needs: [quality]
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://bookwise_app:app_ci_pw@localhost:5432/bookwise_e2e
      DATABASE_MIGRATION_URL: postgres://bookwise_owner:owner_ci_pw@localhost:5432/bookwise_e2e
      REDIS_URL: redis://localhost:6379/2
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      REQUIRE_EMAIL_VERIFICATION: "false"
      MAIL_TRANSPORT: log
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - name: Database
        env: { PGPASSWORD: postgres }
        run: |
          psql -h localhost -U postgres -v owner_password=owner_ci_pw -v app_password=app_ci_pw -f scripts/db/create-roles.sql
          psql -h localhost -U postgres -v dbname=bookwise_e2e -f scripts/db/create-database.sql
          npm run db:migrate
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
